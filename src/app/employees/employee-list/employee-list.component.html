<div class="space-y-8 animate-fade-in pb-12">
    <!-- Header Area -->
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-8">
        <div>
            <h2 class="text-4xl font-black text-navy tracking-tight">Employee <span class="text-gold">Directory</span></h2>
            <p class="text-xs text-gray-400 font-bold uppercase tracking-[0.3em] mt-2">Manage staff and system access</p>
        </div>

        <div class="flex flex-col sm:flex-row items-center gap-4">
            <div class="relative group w-full sm:w-80">
                <input type="text" [(ngModel)]="searchTerm" (keyup.enter)="onSearch()"
                    placeholder="Search employees..."
                    class="w-full pl-12 pr-6 py-4 bg-white border-2 border-transparent rounded-[2rem] shadow-xl shadow-navy/5 focus:border-gold outline-none transition-all font-bold text-navy placeholder:text-gray-300">
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 absolute left-5 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-gold transition-colors"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>

            <button routerLink="add"
                class="w-full sm:w-auto px-8 py-4 bg-navy text-white rounded-[2rem] font-black text-xs uppercase tracking-widest hover:bg-gold transition-all duration-500 shadow-2xl shadow-navy/20 flex items-center justify-center gap-3 group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:rotate-90 transition-transform"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
                </svg>
                New Employee
            </button>
        </div>
    </div>

    <!-- Table Section -->
    <div class="premium-card rounded-[2rem] overflow-hidden border border-gray-100 shadow-xl bg-white relative">
        <div *ngIf="loading"
            class="absolute inset-0 bg-white/50 backdrop-blur-[2px] z-10 flex items-center justify-center">
            <div class="w-12 h-12 border-4 border-gold border-t-transparent rounded-full animate-spin"></div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50/50 border-b border-gray-100">
                        <th class="px-8 py-5 text-[10px] font-black text-navy/40 uppercase tracking-[0.2em]">Employee</th>
                        <th class="px-8 py-5 text-[10px] font-black text-navy/40 uppercase tracking-[0.2em]">Role</th>
                        <th class="px-8 py-5 text-[10px] font-black text-navy/40 uppercase tracking-[0.2em]">Contact</th>
                        <th class="px-8 py-5 text-[10px] font-black text-navy/40 uppercase tracking-[0.2em]">Status</th>
                        <th class="px-8 py-5 text-[10px] font-black text-navy/40 uppercase tracking-[0.2em] text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-50">
                    <tr *ngFor="let emp of employees" class="group hover:bg-gray-50/50 transition-all duration-300">
                        <td class="px-8 py-6">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl bg-gray-100 overflow-hidden shadow-inner flex-shrink-0 border border-gray-100">
                                    <img [src]="emp.image || '/assets/default-avatar.png'"
                                        class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                                </div>
                                <div>
                                    <h4 class="font-black text-navy tracking-tight capitalize group-hover:text-gold transition-colors">{{emp.name}}</h4>
                                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">{{emp.email}}</p>
                                </div>
                            </div>
                        </td>
                        <td class="px-8 py-6">
                            <span class="px-3 py-1 bg-navy/5 text-navy rounded-lg text-[10px] font-black uppercase tracking-wider">
                                {{emp.role?.replace('_', ' ')}}
                            </span>
                        </td>
                        <td class="px-8 py-6">
                            <span class="text-sm font-bold text-gray-500">{{emp.mobile}}</span>
                        </td>
                        <td class="px-8 py-6">
                            <button (click)="toggleStatus(emp)"
                                [class]="emp.status === 'active' ? 'bg-green-50 text-green-600 border-green-100' : 'bg-red-50 text-red-600 border-red-100'"
                                class="px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest border transition-all hover:scale-105">
                                {{emp.status}}
                            </button>
                        </td>
                        <td class="px-8 py-6 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <ng-container *ngIf="emp.role !== 'super_admin' || currentUserRole === 'super_admin'">
                                    <button [routerLink]="['edit', emp.id]"
                                        class="p-2 bg-navy/5 text-navy rounded-lg hover:bg-navy hover:text-white transition-all">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                        </svg>
                                    </button>
                                </ng-container>
                                <ng-container *ngIf="emp.role !== 'super_admin'">
                                    <button (click)="deleteEmployee(emp.id)"
                                        class="p-2 bg-red-50 text-red-500 rounded-lg hover:bg-red-500 hover:text-white transition-all">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                        </svg>
                                    </button>
                                </ng-container>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Elegant Empty State -->
        <div *ngIf="employees.length === 0 && !loading" class="p-20 text-center">
            <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
            </div>
            <h3 class="text-xl font-black text-navy tracking-tight">No Employees Found</h3>
            <p class="text-gray-400 font-bold text-xs uppercase tracking-widest mt-2">Add a new employee to get started</p>
        </div>

        <!-- Pagination -->
        <app-pagination *ngIf="!loading && employees.length > 0"
            [total]="pagination.total" 
            [page]="pagination.page" 
            [limit]="pagination.limit" 
            [totalPages]="pagination.totalPages"
            (pageChange)="onPageChange($event)">
        </app-pagination>
    </div>
</div>
