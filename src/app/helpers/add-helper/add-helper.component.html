<div class="max-w-4xl mx-auto space-y-10 pb-10">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-3xl font-black text-navy tracking-tight">Add New <span class="text-gold">Helper Service</span></h2>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.3em] mt-2">Register a new specialized trade under a designated sector and category</p>
        </div>
        <a routerLink="/helpers/services"
            class="px-6 py-3 bg-navy/5 text-navy rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-navy hover:text-white transition-all">
            Back to List
        </a>
    </div>

    <div class="bg-white p-10 rounded-[2.5rem] border border-gray-50 shadow-2xl">
        <form (ngSubmit)="onSubmit()" #helperForm="ngForm" class="space-y-8">
            <!-- Service Name & Daily Rate -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-navy/40 uppercase tracking-widest">Service Name *</label>
                    <input type="text" name="service_name" [(ngModel)]="helper.service_name" required
                        placeholder="Enter trade name (e.g. Mason, Electrician)"
                        class="w-full px-8 py-5 bg-gray-50 border-2 border-transparent rounded-[1.5rem] focus:bg-white focus:border-gold outline-none transition-all font-bold text-navy shadow-inner">
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-navy/40 uppercase tracking-widest">Daily Rate (₹ / Day) *</label>
                    <input type="number" name="price_per_day" [(ngModel)]="helper.price_per_day" required min="0"
                        placeholder="e.g. 800"
                        class="w-full px-8 py-5 bg-gray-50 border-2 border-transparent rounded-[1.5rem] focus:bg-white focus:border-gold outline-none transition-all font-bold text-navy shadow-inner">
                </div>
            </div>

            <!-- Hierarchy Mapping: Main Category, Category, Subcategory -->
            <div class="p-6 bg-navy/[0.02] border border-gray-100 rounded-3xl space-y-6">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-gold/10 flex items-center justify-center text-gold font-black text-xs">#</div>
                    <h3 class="text-sm font-black text-navy uppercase tracking-wider">Hierarchy Placement</h3>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Main Category -->
                    <div class="space-y-2">
                        <label class="block text-[10px] font-black text-navy/40 uppercase tracking-widest">Main Category (Sector) *</label>
                        <select name="main_category_id" [(ngModel)]="helper.main_category_id" (change)="onMainCategoryChange()" required
                            class="w-full px-5 py-4 bg-white border-2 border-gray-100 rounded-2xl focus:border-gold outline-none transition-all font-bold text-navy text-sm shadow-sm">
                            <option [ngValue]="null" disabled>Select Sector</option>
                            <option *ngFor="let mc of mainCategories" [ngValue]="mc.id">{{ mc.name }}</option>
                        </select>
                    </div>

                    <!-- Category -->
                    <div class="space-y-2">
                        <label class="block text-[10px] font-black text-navy/40 uppercase tracking-widest">Category</label>
                        <select name="category_id" [(ngModel)]="helper.category_id" (change)="onCategoryChange()" [disabled]="!helper.main_category_id"
                            class="w-full px-5 py-4 bg-white border-2 border-gray-100 rounded-2xl focus:border-gold outline-none transition-all font-bold text-navy text-sm shadow-sm disabled:opacity-50">
                            <option [ngValue]="null">None / All</option>
                            <option *ngFor="let c of filteredCategories" [ngValue]="c.id">{{ c.name }}</option>
                        </select>
                    </div>

                    <!-- Subcategory -->
                    <div class="space-y-2">
                        <label class="block text-[10px] font-black text-navy/40 uppercase tracking-widest">Subcategory</label>
                        <select name="subcategory_id" [(ngModel)]="helper.subcategory_id" [disabled]="!helper.category_id"
                            class="w-full px-5 py-4 bg-white border-2 border-gray-100 rounded-2xl focus:border-gold outline-none transition-all font-bold text-navy text-sm shadow-sm disabled:opacity-50">
                            <option [ngValue]="null">None / All</option>
                            <option *ngFor="let s of subcategories" [ngValue]="s.id">{{ s.name }}</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Image URL & Mobile -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-navy/40 uppercase tracking-widest">Icon / Image URL</label>
                    <input type="text" name="image" [(ngModel)]="helper.image"
                        placeholder="https://images.unsplash.com/... or icon"
                        class="w-full px-8 py-5 bg-gray-50 border-2 border-transparent rounded-[1.5rem] focus:bg-white focus:border-gold outline-none transition-all font-bold text-navy shadow-inner">
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-navy/40 uppercase tracking-widest">Contact Mobile</label>
                    <input type="text" name="mobile" [(ngModel)]="helper.mobile"
                        placeholder="+91 9876543210"
                        class="w-full px-8 py-5 bg-gray-50 border-2 border-transparent rounded-[1.5rem] focus:bg-white focus:border-gold outline-none transition-all font-bold text-navy shadow-inner">
                </div>
            </div>

            <!-- Description -->
            <div class="space-y-3">
                <label class="block text-[10px] font-black text-navy/40 uppercase tracking-widest">Service Description</label>
                <textarea name="description" [(ngModel)]="helper.description" rows="3"
                    placeholder="Provide details about the service scope, skills, and qualifications..."
                    class="w-full px-8 py-5 bg-gray-50 border-2 border-transparent rounded-[1.5rem] focus:bg-white focus:border-gold outline-none transition-all font-bold text-navy shadow-inner resize-none"></textarea>
            </div>

            <!-- Status Toggle -->
            <div class="flex items-center justify-between p-8 bg-gold/5 rounded-[1.5rem] border border-gold/10">
                <div>
                    <span class="block text-xs font-black text-navy uppercase tracking-widest">Active Status</span>
                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Toggle visibility across client portal</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" name="status" [checked]="helper.status === 'Active'"
                        (change)="helper.status = $any($event.target).checked ? 'Active' : 'Inactive'"
                        class="sr-only peer">
                    <div class="w-14 h-8 bg-gray-200 rounded-full peer peer-checked:bg-gold transition-all after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:after:translate-x-6">
                    </div>
                </label>
            </div>

            <button type="submit" [disabled]="!helperForm.valid || saving"
                class="w-full py-5 bg-gold text-white rounded-[1.5rem] font-black text-xs uppercase tracking-widest hover:bg-navy transition-all shadow-xl shadow-gold/20 disabled:opacity-50 disabled:cursor-not-allowed">
                <span *ngIf="!saving">Save Helper Service</span>
                <span *ngIf="saving">Saving...</span>
            </button>
        </form>
    </div>
</div>
