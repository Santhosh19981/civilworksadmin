<div class="max-w-4xl mx-auto pb-12 animate-fade-in relative">
    
    <!-- Header -->
    <div class="mb-10 text-center relative z-10">
        <h2 class="text-4xl font-black text-navy tracking-tight">Your <span class="text-gold">Profile</span></h2>
        <p class="text-xs text-gray-400 font-bold uppercase tracking-[0.3em] mt-2">Manage your personal information</p>
    </div>

    <!-- Toast Notification -->
    <div *ngIf="showToastMsg"
        class="fixed top-6 right-6 z-50 px-8 py-4 rounded-2xl shadow-2xl flex items-center gap-4 animate-slide-in"
        [ngClass]="toastType === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'">
        <svg *ngIf="toastType === 'success'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <svg *ngIf="toastType === 'error'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="font-bold tracking-wide text-sm">{{ toastMessage }}</span>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="save()" class="relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Photo -->
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-3xl border border-gray-50 text-center relative group overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-gold/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                
                <div class="relative w-32 h-32 mx-auto mb-6">
                    <div class="absolute inset-0 bg-gold/20 rounded-[2rem] blur-xl animate-pulse"></div>
                    <div class="relative w-full h-full rounded-[2rem] overflow-hidden bg-gray-100 border-4 border-white shadow-2xl group flex items-center justify-center">
                        <ng-container *ngIf="profileImage; else noImage">
                            <img [src]="profileImage" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        </ng-container>
                        <ng-template #noImage>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </ng-template>

                        <!-- Upload Overlay -->
                        <div class="absolute inset-0 bg-navy/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center cursor-pointer"
                             (click)="fileInput.click()">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <h3 class="font-black text-navy text-xl">{{ profileForm.get('name')?.value || 'User Profile' }}</h3>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em] mt-1 mb-6">Profile Photo</p>
                
                <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" class="hidden">
                <button type="button" (click)="fileInput.click()" [disabled]="uploading"
                    class="w-full py-4 rounded-2xl font-black text-[10px] uppercase tracking-[0.2em] transition-all bg-gray-50 text-navy hover:bg-gold hover:text-white border border-gray-100 flex items-center justify-center gap-2">
                    <span *ngIf="uploading" class="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"></span>
                    {{ uploading ? 'Uploading...' : 'Upload Photo' }}
                </button>
            </div>
            
            <button type="submit" [disabled]="loading || profileForm.invalid"
                class="w-full py-5 rounded-[2rem] font-black text-xs uppercase tracking-[0.3em] text-white transition-all shadow-2xl relative overflow-hidden group"
                [ngClass]="(profileForm.invalid || loading) ? 'bg-gray-300 cursor-not-allowed shadow-none' : 'bg-navy hover:bg-gold hover:-translate-y-1 shadow-navy/20 hover:shadow-gold/30'">
                <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500 ease-out"></div>
                <span class="relative flex items-center justify-center gap-3">
                    <span *ngIf="loading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                    <ng-container *ngIf="!loading">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Save Profile Changes
                    </ng-container>
                </span>
            </button>
        </div>

        <!-- Right Column: Details -->
        <div class="lg:col-span-8 space-y-6">
            <div class="bg-white rounded-[2.5rem] p-8 sm:p-10 shadow-3xl border border-gray-50">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    
                    <div class="space-y-2">
                        <label class="block text-[9px] font-black text-navy/40 uppercase tracking-[0.2em]">Full Name</label>
                        <input type="text" formControlName="name"
                            class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-[1.5rem] focus:bg-white focus:border-gold outline-none transition-all font-bold text-navy placeholder:text-gray-300 text-sm">
                        <span *ngIf="profileForm.get('name')?.invalid && profileForm.get('name')?.touched" class="text-xs font-bold text-red-500 pl-4">Name must be at least 3 characters.</span>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-[9px] font-black text-navy/40 uppercase tracking-[0.2em]">Email Address</label>
                        <input type="email" formControlName="email"
                            class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-[1.5rem] focus:bg-white focus:border-gold outline-none transition-all font-bold text-navy placeholder:text-gray-300 text-sm">
                        <span *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched" class="text-xs font-bold text-red-500 pl-4">Valid email is required.</span>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-[9px] font-black text-navy/40 uppercase tracking-[0.2em]">Mobile Number</label>
                        <input type="text" formControlName="mobile"
                            class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-[1.5rem] focus:bg-white focus:border-gold outline-none transition-all font-bold text-navy placeholder:text-gray-300 text-sm">
                        <span *ngIf="profileForm.get('mobile')?.invalid && profileForm.get('mobile')?.touched" class="text-xs font-bold text-red-500 pl-4">Valid 10-15 digit number is required.</span>
                    </div>

                    <!-- Password Field for Updates -->
                    <div class="space-y-2 md:col-span-2 mt-4 pt-6 md:pt-8 md:mt-4 border-t border-gray-100">
                        <label class="block text-[9px] font-black text-navy/40 uppercase tracking-[0.2em]">Change Password <span class="text-gold">(Optional)</span></label>
                        <input type="password" formControlName="password" placeholder="Leave blank to keep current password"
                            class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-[1.5rem] focus:bg-white focus:border-gold outline-none transition-all font-bold text-navy placeholder:text-gray-300 text-sm">
                        <span *ngIf="profileForm.get('password')?.invalid && profileForm.get('password')?.touched" class="text-xs font-bold text-red-500 pl-4">Password must be at least 6 characters.</span>
                    </div>

                </div>
            </div>
        </div>
    </form>
</div>
